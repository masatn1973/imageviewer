<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafcff"/>
      <stop offset="100%" stop-color="#dbe8ff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf3ff"/>
    </linearGradient>
    <linearGradient id="mountainA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54d0ff"/>
      <stop offset="100%" stop-color="#3584ff"/>
    </linearGradient>
    <linearGradient id="mountainB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe3ff"/>
      <stop offset="100%" stop-color="#4caeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- GNOME/libadwaita style rounded tile -->
  <rect x="32" y="32" width="448" height="448" rx="96"
        fill="url(#frame)" filter="url(#shadow)"/>

  <!-- image area -->
  <rect x="64" y="64" width="384" height="384" rx="72"
        fill="url(#bg)"/>

  <!-- sun -->
  <circle cx="150" cy="145" r="38" fill="#ffbf3d"/>

  <!-- cloud -->
  <path d="M300 130c12-26 50-31 70-9c25-8 50 10 50 35H270c0-15 13-26 30-26z"
        fill="#d9e7f5"/>

  <!-- mountains -->
  <path d="M92 350 L210 225 L315 350 Z" fill="url(#mountainB)"/>
  <path d="M180 350 L340 165 L420 350 Z" fill="url(#mountainA)"/>

  <!-- subtle horizon -->
  <rect x="64" y="350" width="384" height="40"
        fill="#bde7ff" opacity="0.8"/>

  <!-- GNOME-style highlight -->
  <path d="M64 120 C64 88,88 64,120 64 L392 64"
        fill="none" stroke="#ffffff" stroke-width="8" opacity="0.65"/>
</svg>
